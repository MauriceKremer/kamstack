name: Release

on:
  push:
    tags: ["v*"]

# A release is one ordered run: verify, build every target, then publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: './go.mod'
          cache: true

      - name: Verify gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race ./...

  build:
    needs: verify
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        include:
          - goarch: arm64
            goarm: ""
            pkgarch: arm64
          - goarch: arm
            goarm: "7"
            pkgarch: armv7
          - goarch: amd64
            goarm: ""
            pkgarch: amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: './go.mod'
          cache: true

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="kamstack_${version}_linux_${{ matrix.pkgarch }}"
          mkdir -p "dist/${name}"
          go build -trimpath -ldflags "-s -w -X main.version=${version} -X main.releaseRepo=${GITHUB_REPOSITORY}" -o "dist/${name}/kamstack" .

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="kamstack_${version}_linux_${{ matrix.pkgarch }}"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -rf "dist/${name}"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: kamstack_${{ github.ref_name }}_linux_${{ matrix.pkgarch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: './go.mod'
          cache: true

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          pattern: kamstack_*_linux_*
          path: dist
          merge-multiple: true

      - name: Smoke check the amd64 archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p smoke
          tar -C smoke -xzf "dist/kamstack_${version}_linux_amd64.tar.gz"
          got="$(smoke/kamstack_${version}_linux_amd64/kamstack version | head -n 1)"
          echo "$got"
          test "$got" = "kamstack ${version} linux/amd64"

      # Read stack.yml, verify both pinned component releases and their
      # SHA256SUMS, and write manifest.json. A missing tag, archive or checksum
      # fails the release (DST-25).
      - name: Generate manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          go run ./tools/manifest \
            -stack stack.yml \
            -out dist/manifest.json \
            -version "${GITHUB_REF_NAME#v}" \
            -kam-repo "${GITHUB_REPOSITORY_OWNER}/kam" \
            -kammon-repo "${GITHUB_REPOSITORY_OWNER}/kammon"

      - name: Write SHA256SUMS
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*.tar.gz dist/SHA256SUMS dist/manifest.json
